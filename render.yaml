services:
  - type: web
    name: buydips
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 2 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Must be the SAME value as the SECRET_KEY secret in GitHub (it signs unsubscribe links).
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      # Render's free plan blocks SMTP, so email goes through Resend's HTTPS API.
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_API_KEY
        sync: false
      - key: MAIL_FROM
        value: alerts@buydips.in
