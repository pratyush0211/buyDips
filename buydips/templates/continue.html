{% extends "base.html" %}
{% block title %}Continue to buyDips{% endblock %}
{% block body %}
<div class="container">
  <div class="card center-card">
    <div class="icon-badge" aria-hidden="true">&#10003;</div>
    <h1>Ready to sign in</h1>
    <p>Tap the button to open your watchlist.</p>
    <form method="post" action="/signin/{{ code }}" data-busy="Signing you in&hellip;">
      <input type="hidden" name="csrf" value="{{ csrf_token() }}">
      <button class="btn btn-primary btn-block">Continue to buyDips</button>
    </form>
  </div>
</div>
{% endblock %}
