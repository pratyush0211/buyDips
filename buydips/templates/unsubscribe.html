{% extends "base.html" %}
{% block title %}Unsubscribe · buyDips{% endblock %}
{% block body %}
<div class="container">
  <div class="card center-card">
    <div class="icon-badge" aria-hidden="true">✉</div>
    <h1>Unsubscribe from buyDips?</h1>
    <p>You'll stop getting alert emails. Your watchlist is kept, and you can turn alerts back on any time by signing in again.</p>
    <form method="post" action="/unsubscribe/{{ token }}">
      <button class="btn btn-primary">Yes, unsubscribe me</button>
    </form>
  </div>
</div>
{% endblock %}
