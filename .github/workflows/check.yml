name: buyDips check

on:
  schedule:
    # Every 20 minutes, Mon–Fri, 00:00–21:59 UTC (covers Asia, India, Europe and US hours).
    # GitHub can delay scheduled runs by several minutes.
    - cron: "*/20 0-21 * * 1-5"
  workflow_dispatch: {}  # lets you run it manually from the Actions tab

permissions:
  contents: write  # to save alerts_state.json back to the repo

concurrency:
  group: buydips
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check indexes and send alerts
        env:
          WHATSAPP_PROVIDER: meta
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_PHONE_NUMBER_ID: ${{ secrets.META_PHONE_NUMBER_ID }}
          META_TO: ${{ secrets.META_TO }}
          META_TEMPLATE_NAME: ${{ vars.META_TEMPLATE_NAME }}
          META_TEMPLATE_LANG: ${{ vars.META_TEMPLATE_LANG }}
          SMTP_USER: ${{ secrets.BUYDIPSEMAIL }}
          SMTP_PASSWORD: ${{ secrets.BUYDIPSPASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DIP_THRESHOLD_PCT: "1.0"
          INDEXES: "^GSPC=S&P 500,^IXIC=Nasdaq Composite,^DJI=Dow Jones,^RUT=Russell 2000,^NSEI=Nifty 50,^BSESN=Sensex,^FTSE=FTSE 100,^N225=Nikkei 225"
        run: python check.py

      - name: Save alert state
        run: |
          if [[ -n "$(git status --porcelain alerts_state.json)" ]]; then
            git config user.name "buyDips bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add alerts_state.json
            git commit -m "Update alert state"
            git push
          fi
