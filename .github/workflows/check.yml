name: buyDips check

on:
  schedule:
    # Every 20 minutes, Mon–Fri, 00:00–21:59 UTC (Asia, India, Europe and US hours).
    # GitHub can delay scheduled runs by several minutes.
    - cron: "*/20 0-21 * * 1-5"
  workflow_dispatch:

concurrency:
  group: buydips
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check prices and email subscribers
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          BASE_URL: https://buydips.in
          SMTP_HOST: smtp.resend.com
          SMTP_PORT: "465"
          SMTP_USER: resend
          SMTP_PASSWORD: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: alerts@buydips.in
        run: python run_check.py
